# Blueprint do Render (PaaS): cria o serviço web automaticamente a partir do repositório.
services:
  - type: web
    name: caderno-de-caixa
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm test
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false # definida no painel do Render, nunca no código
